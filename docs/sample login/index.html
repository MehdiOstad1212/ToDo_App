<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Toastify CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
</head>

<body class="bg-light">

    <!-- Center the form using Bootstrap flex utilities -->
    <div class="container min-vh-100 d-flex justify-content-center align-items-center">

        <div class="card shadow-lg p-4"
            style="width: 100%; max-width: 400px; border-radius: 10px;">

            <h2 class="text-center mb-4 text-primary">Login</h2>

            <!-- Login Form -->
            <form id="loginForm">

                <!-- Username input -->
                <div class="mb-3">
                    <label for="user_name" class="form-label">Username</label>

                    <input type="text"
                        id="user_name"
                        name="user_name"
                        class="form-control"
                        placeholder="Enter your username"
                        required>
                </div>

                <!-- Password input -->
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>

                    <input type="password"
                        id="password"
                        name="password"
                        class="form-control"
                        placeholder="Enter your password"
                        required>
                </div>

                <!-- Submit button -->
                <div class="d-grid">
                    <button type="submit" class="btn btn-primary">
                        Login
                    </button>
                </div>

            </form>

            <!-- Forgot password link -->
            <div class="text-center mt-3">
                <a href="#" class="text-muted">
                    Forgot your password?
                </a>
            </div>

            <!-- Register link -->
            <div class="text-center mt-2">
                <p class="text-muted">
                    Don't have an account?
                    <a href="#" class="text-primary">Sign up</a>
                </p>
            </div>

        </div>
    </div>

    <!-- Bootstrap JS and Popper.js -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.min.js"></script>

    <!-- Toastify JS -->
    <script src="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.js"></script>

    <script>

        document.getElementById("loginForm").addEventListener("submit", async function (event) {

            // Prevent normal form submission
            event.preventDefault();

            // Get form data
            const formData = new FormData(this);

            const user_name = formData.get("user_name");
            const password = formData.get("password");

            // Create request body
            const requestBody = {
                user_name: user_name,
                password: password
            };

            try {

                // Send login request to FastAPI
                const response = await fetch(
                    "http://127.0.0.1:8000/users/login",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify(requestBody)
                    }
                );

                // Successful login
                if (response.ok) {

                    const responseDetail = await response.json();

                    document.querySelector(".card").innerHTML = `
                        <h2 class="text-center mb-4 text-success">
                            Logged in Successfully!
                        </h2>

                        <p class="text-center">
                            Welcome, ${user_name}!
                        </p>
                    `;

                    Toastify({
                        text: responseDetail.detail || "Login successful.",
                        duration: 4000,
                        close: true,
                        gravity: "top",
                        position: "right"
                    }).showToast();

                }

                // Login failed
                else {

                    const responseDetail = await response.json();

                    console.log("FastAPI error:", responseDetail);

                    Toastify({
                        text: responseDetail.detail || "Login failed.",
                        duration: 4000,
                        close: true,
                        gravity: "top",
                        position: "right"
                    }).showToast();
                }

            }

            // Network/server error
            catch (error) {

                console.error("Error:", error);

                Toastify({
                    text: "Could not connect to the server.",
                    duration: 4000,
                    close: true,
                    gravity: "top",
                    position: "right"
                }).showToast();
            }

        });

    </script>

</body>

</html>
